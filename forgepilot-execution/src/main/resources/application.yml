server:
  port: 8081

spring:
  application:
    name: forgepilot-execution

management:
  endpoints:
    web:
      exposure:
        include: health,info

forgepilot:
  control-plane:
    base-url: ${FORGEPILOT_CONTROL_PLANE_URL:http://localhost:8080}
  storage:
    root: ${FORGEPILOT_STORAGE_ROOT:${java.io.tmpdir}/forgepilot-execution}
  model-proxy:
    # 对 Agent 暴露 Responses。MVP 与执行服务同端口，路径 /v1/responses。
    wire-api: responses
    bind: 127.0.0.1
    port: ${server.port:8081}
    token-ttl-seconds: 3600
  isolation:
    # 意图：Agent 默认拒绝访问控制面管理面与中间件；容器网络策略后续落实。
    default-deny-egress: true
    deny-agent-env-keys:
      - POSTGRES
      - RABBIT
      - REDIS
      - MINIO
      - FORGEPILOT_JWT

  node:
    key: ${FORGEPILOT_NODE_KEY:local-exec-1}
    capacity: ${FORGEPILOT_NODE_CAPACITY:4}
  internal-api:
    token: ${FORGEPILOT_INTERNAL_TOKEN:}
