# 本机开发默认值，与 docker-compose.yml 一致。不是生产密钥。
server:
  port: 8080

spring:
  application:
    name: forgepilot-server
  datasource:
    url: ${FORGEPILOT_DB_URL:jdbc:postgresql://localhost:5432/forgepilot}
    username: ${FORGEPILOT_DB_USERNAME:forgepilot}
    password: ${FORGEPILOT_DB_PASSWORD:forgepilot}
  flyway:
    enabled: true
  data:
    redis:
      host: ${FORGEPILOT_REDIS_HOST:localhost}
      port: ${FORGEPILOT_REDIS_PORT:6379}
  rabbitmq:
    host: ${FORGEPILOT_RABBIT_HOST:localhost}
    port: ${FORGEPILOT_RABBIT_PORT:5672}
    username: ${FORGEPILOT_RABBIT_USERNAME:forgepilot}
    password: ${FORGEPILOT_RABBIT_PASSWORD:forgepilot}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
      insert-strategy: not_null
      update-strategy: not_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

forgepilot:

  workers:
    # 单元测试不启动 Spring 上下文；本机/Compose 默认开启轮询 worker
    enabled: ${FORGEPILOT_WORKERS_ENABLED:true}
    outbox-drain:
      enabled: ${FORGEPILOT_WORKER_OUTBOX:true}
      delay-ms: 5000
    log-archive-retry:
      enabled: ${FORGEPILOT_WORKER_LOG_ARCHIVE:true}
      delay-ms: 15000
    workspace-retention:
      enabled: ${FORGEPILOT_WORKER_RETENTION:true}
      delay-ms: 60000
  minio:
    enabled: ${FORGEPILOT_MINIO_ENABLED:false}
    endpoint: ${FORGEPILOT_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${FORGEPILOT_MINIO_ACCESS_KEY:forgepilot}
    secret-key: ${FORGEPILOT_MINIO_SECRET_KEY:forgepilot-dev}
    bucket: ${FORGEPILOT_MINIO_BUCKET:forgepilot}
  rabbit:
    # false：控制事件走内存假 broker（默认，单元测试无需 RabbitMQ）
    # true：Outbox 排空到 RabbitMQ（需 Compose 中的 rabbitmq）
    enabled: ${FORGEPILOT_RABBIT_ENABLED:false}
  docker:
    allowlist-network:
      # 默认 false → Docker runtime 使用 network=none（安全默认）
      enabled: ${FORGEPILOT_DOCKER_ALLOWLIST_NETWORK:false}
      name: ${FORGEPILOT_DOCKER_ALLOWLIST_NETWORK_NAME:forgepilot-egress}
  execution:
    base-url: ${FORGEPILOT_EXECUTION_URL:http://localhost:8081}
    heartbeat-timeout-seconds: ${FORGEPILOT_NODE_HEARTBEAT_TIMEOUT:45}
  internal-api:
    # 面向执行面的身份由部署环境注入，不复用用户 JWT，也不在仓库里放共享密钥。
    configured: false

  jwt:
    # 本机开发密钥，生产必须注入更长的随机值。
    secret: ${FORGEPILOT_JWT_SECRET:forgepilot-local-dev-secret-change-me-32b}
    expire-seconds: ${FORGEPILOT_JWT_EXPIRE_SECONDS:86400}
  workspace:
    storage-root: ${FORGEPILOT_WORKSPACE_ROOT:${java.io.tmpdir}/forgepilot-workspaces}
    # 任务 COMPLETED/FAILED/CANCELLED 后保留工作区的宽限天数；停止容器不会删工作区
    retention-grace-days: ${FORGEPILOT_WORKSPACE_RETENTION_GRACE_DAYS:7}
  git:
    token-ttl-seconds: ${FORGEPILOT_GIT_TOKEN_TTL_SECONDS:900}
  gitlab:
    token: ${FORGEPILOT_GITLAB_TOKEN:}
